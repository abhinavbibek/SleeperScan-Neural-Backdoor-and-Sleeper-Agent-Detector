[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "sleeperscan"
version = "0.1.0"
description = "Inference-only neural backdoor and sleeper agent detector for open-weight LLMs"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["ai-security", "llm", "backdoor", "mechanistic-interpretability", "neural-security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]

dependencies = [
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "peft>=0.10.0",
    "bitsandbytes>=0.43.0",
    "datasets>=2.18.0",
    "trl>=0.8.6",
    "accelerate>=0.28.0",
    "einops>=0.7.0",
    "scipy>=1.12.0",
    "numpy>=1.26.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.9.0",
    "ruff>=0.4.0",
]
train = [
    "trl>=0.8.6",
    "bitsandbytes>=0.43.0",
    "peft>=0.10.0",
]

[project.scripts]
sleeperscan = "sleeperscan.scanner:main"

[project.urls]
Repository = "https://github.com/abhinavbibek/SleeperScan-Neural-Backdoor-and-Sleeper-Agent-Detector"
Issues = "https://github.com/abhinavbibek/SleeperScan-Neural-Backdoor-and-Sleeper-Agent-Detector/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["sleeperscan*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
